<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" fill="#111">GaariHel Three-Tier Architecture</text>

  <rect x="40" y="55" width="280" height="170" rx="8" fill="#e8f0fe" stroke="#222" stroke-width="1.5"/>
  <text x="180" y="85" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" fill="#111">Presentation Tier</text>
  <text x="180" y="115" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">React 19 + Vite (PWA)</text>
  <text x="180" y="140" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Admin / Customer / Driver UI</text>
  <text x="180" y="165" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Leaflet maps / EN-SO language</text>
  <text x="180" y="190" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Browser Geolocation (driver GPS)</text>

  <rect x="360" y="55" width="280" height="170" rx="8" fill="#fef7e0" stroke="#222" stroke-width="1.5"/>
  <text x="500" y="85" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" fill="#111">Application Tier</text>
  <text x="500" y="115" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Node.js + Express REST API</text>
  <text x="500" y="140" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">JWT auth + Zod validation</text>
  <text x="500" y="165" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Repositories + Socket.io</text>
  <text x="500" y="190" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Pricing / Trip status / Payments</text>

  <rect x="680" y="55" width="280" height="170" rx="8" fill="#e6f4ea" stroke="#222" stroke-width="1.5"/>
  <text x="820" y="85" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" fill="#111">Data Tier</text>
  <text x="820" y="115" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">PostgreSQL 16</text>
  <text x="820" y="140" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Prisma ORM + migrations</text>
  <text x="820" y="165" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Users / Trips / SharedTrip</text>
  <text x="820" y="190" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">Payments / Settings / AuditLog</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#222"/>
    </marker>
  </defs>
  <line x1="320" y1="140" x2="360" y2="140" stroke="#222" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="640" y1="140" x2="680" y2="140" stroke="#222" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="120" y="260" width="760" height="120" rx="8" fill="#fff8e1" stroke="#222" stroke-width="1.5"/>
  <text x="500" y="295" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="14" font-weight="bold" fill="#111">External Integrations</text>
  <text x="500" y="325" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">WaafiPay (EVC Plus / ZAAD)  |  Gmail SMTP (OTP / email)</text>
  <text x="500" y="352" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" fill="#111">SMS gateway  |  Cloudinary (cargo photos, POD, documents)</text>
</svg>
