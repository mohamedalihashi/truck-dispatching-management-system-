<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="16" font-weight="bold" fill="#111">GaariHel Use Case Diagram</text>

  <!-- System boundary -->
  <rect x="220" y="55" width="660" height="620" rx="6" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
  <text x="550" y="80" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="13" font-weight="bold" fill="#111">GaariHel System</text>

  <!-- Actors left: Customer -->
  <circle cx="80" cy="160" r="18" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="178" x2="80" y2="230" stroke="#222" stroke-width="1.5"/>
  <line x1="55" y1="200" x2="105" y2="200" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="230" x2="60" y2="265" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="230" x2="100" y2="265" stroke="#222" stroke-width="1.5"/>
  <text x="80" y="290" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" fill="#111">Customer</text>

  <!-- Actors left: FTL Driver -->
  <circle cx="80" cy="380" r="18" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="398" x2="80" y2="450" stroke="#222" stroke-width="1.5"/>
  <line x1="55" y1="420" x2="105" y2="420" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="450" x2="60" y2="485" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="450" x2="100" y2="485" stroke="#222" stroke-width="1.5"/>
  <text x="80" y="510" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" fill="#111">FTL Driver</text>

  <!-- Actors left: SHARED Driver -->
  <circle cx="80" cy="580" r="18" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="598" x2="80" y2="640" stroke="#222" stroke-width="1.5"/>
  <line x1="55" y1="615" x2="105" y2="615" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="640" x2="60" y2="670" stroke="#222" stroke-width="1.5"/>
  <line x1="80" y1="640" x2="100" y2="670" stroke="#222" stroke-width="1.5"/>
  <text x="80" y="695" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" fill="#111">SHARED Driver</text>

  <!-- Actor right: Admin -->
  <circle cx="1020" cy="280" r="18" fill="none" stroke="#222" stroke-width="1.5"/>
  <line x1="1020" y1="298" x2="1020" y2="350" stroke="#222" stroke-width="1.5"/>
  <line x1="995" y1="320" x2="1045" y2="320" stroke="#222" stroke-width="1.5"/>
  <line x1="1020" y1="350" x2="1000" y2="385" stroke="#222" stroke-width="1.5"/>
  <line x1="1020" y1="350" x2="1040" y2="385" stroke="#222" stroke-width="1.5"/>
  <text x="1020" y="410" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="12" font-weight="bold" fill="#111">Administrator</text>

  <!-- Supporting actors right -->
  <rect x="945" y="480" width="130" height="36" rx="4" fill="#fff8e1" stroke="#222"/>
  <text x="1010" y="503" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">WaafiPay</text>
  <rect x="945" y="530" width="130" height="36" rx="4" fill="#fff8e1" stroke="#222"/>
  <text x="1010" y="553" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">SMS / Email</text>
  <rect x="945" y="580" width="130" height="36" rx="4" fill="#fff8e1" stroke="#222"/>
  <text x="1010" y="603" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Cloudinary</text>
  <rect x="945" y="630" width="130" height="36" rx="4" fill="#fff8e1" stroke="#222"/>
  <text x="1010" y="653" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Device GPS</text>

  <!-- Use cases (ellipses as rounded rects for readability) -->
  <ellipse cx="400" cy="120" rx="110" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="125" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Register / Login</text>

  <ellipse cx="400" cy="185" rx="120" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="190" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Submit Cargo Request</text>

  <ellipse cx="400" cy="250" rx="110" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="255" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Track Trip / GPS</text>

  <ellipse cx="400" cy="315" rx="110" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="320" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Pay Fare (WaafiPay)</text>

  <ellipse cx="400" cy="380" rx="110" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="385" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Rate Trip / Support</text>

  <ellipse cx="400" cy="470" rx="120" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="475" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Accept / Reject Job</text>

  <ellipse cx="400" cy="540" rx="130" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="545" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Enter Pickup Measurement</text>

  <ellipse cx="400" cy="610" rx="130" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="400" y="615" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Upload POD / Deliver</text>

  <ellipse cx="700" cy="150" rx="130" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="700" y="155" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Register Driver / Truck</text>

  <ellipse cx="700" cy="220" rx="120" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="700" y="225" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Assign FTL Truck</text>

  <ellipse cx="700" cy="290" rx="130" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="700" y="295" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Pool SHARED Loads</text>

  <ellipse cx="700" cy="360" rx="130" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="700" y="365" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Manage Pricing / Settings</text>

  <ellipse cx="700" cy="430" rx="120" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="700" y="435" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">View Audit Logs</text>

  <ellipse cx="700" cy="500" rx="120" ry="28" fill="#ffffff" stroke="#222" stroke-width="1.2"/>
  <text x="700" y="505" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="11" fill="#111">Handle Support</text>

  <!-- Associations Customer -->
  <line x1="105" y1="180" x2="290" y2="125" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="190" x2="280" y2="185" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="200" x2="290" y2="250" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="210" x2="290" y2="315" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="220" x2="290" y2="380" stroke="#555" stroke-width="1"/>

  <!-- FTL Driver -->
  <line x1="105" y1="400" x2="280" y2="470" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="410" x2="270" y2="540" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="420" x2="270" y2="610" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="390" x2="290" y2="250" stroke="#555" stroke-width="1"/>

  <!-- SHARED Driver -->
  <line x1="105" y1="580" x2="280" y2="470" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="590" x2="270" y2="540" stroke="#555" stroke-width="1"/>
  <line x1="105" y1="600" x2="270" y2="610" stroke="#555" stroke-width="1"/>

  <!-- Admin -->
  <line x1="1000" y1="280" x2="830" y2="155" stroke="#555" stroke-width="1"/>
  <line x1="1000" y1="290" x2="820" y2="220" stroke="#555" stroke-width="1"/>
  <line x1="1000" y1="300" x2="830" y2="290" stroke="#555" stroke-width="1"/>
  <line x1="1000" y1="310" x2="830" y2="360" stroke="#555" stroke-width="1"/>
  <line x1="1000" y1="320" x2="820" y2="430" stroke="#555" stroke-width="1"/>
  <line x1="1000" y1="330" x2="820" y2="500" stroke="#555" stroke-width="1"/>
  <line x1="1000" y1="300" x2="510" y2="250" stroke="#555" stroke-width="1"/>

  <!-- External -->
  <line x1="945" y1="498" x2="510" y2="320" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="945" y1="548" x2="510" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="945" y1="598" x2="530" y2="610" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="945" y1="648" x2="510" y2="250" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
