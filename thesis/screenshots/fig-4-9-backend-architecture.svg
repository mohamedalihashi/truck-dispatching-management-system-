<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="Times New Roman, Times, serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#fff"/>
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="bold">GaariHel Backend Layered Architecture</text>

  <rect x="40" y="60" width="160" height="70" fill="#e8f0fe" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="120" y="88" text-anchor="middle" font-weight="bold">Client (React PWA)</text>
  <text x="120" y="108" text-anchor="middle">HTTP / WebSocket</text>

  <rect x="260" y="60" width="180" height="70" fill="#fef7e0" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="350" y="88" text-anchor="middle" font-weight="bold">Express Routes</text>
  <text x="350" y="108" text-anchor="middle">auth, trips, cargo, shared-trips</text>

  <rect x="500" y="60" width="180" height="70" fill="#fce8e6" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="590" y="88" text-anchor="middle" font-weight="bold">Middleware</text>
  <text x="590" y="108" text-anchor="middle">JWT auth, validation, RBAC</text>

  <rect x="260" y="170" width="420" height="90" fill="#e6f4ea" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="470" y="198" text-anchor="middle" font-weight="bold">Repository Layer (services/db/)</text>
  <text x="470" y="220" text-anchor="middle">tripRepository � cargoRepository � sharedTripRepository</text>
  <text x="470" y="240" text-anchor="middle">paymentRepository � userRepository � truckRepository</text>

  <rect x="260" y="300" width="180" height="70" fill="#f3e8fd" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="350" y="328" text-anchor="middle" font-weight="bold">Prisma ORM</text>
  <text x="350" y="348" text-anchor="middle">Schema + migrations</text>

  <rect x="500" y="300" width="180" height="70" fill="#e0e0e0" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="590" y="328" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text x="590" y="348" text-anchor="middle">Managed database</text>

  <rect x="720" y="170" width="160" height="90" fill="#fff8e1" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="800" y="198" text-anchor="middle" font-weight="bold">Integrations</text>
  <text x="800" y="220" text-anchor="middle">WaafiPay � Gmail SMTP</text>
  <text x="800" y="240" text-anchor="middle">Socket.io (GPS)</text>

  <line x1="200" y1="95" x2="260" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="95" x2="500" y2="95" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="130" x2="590" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="260" x2="470" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="335" x2="500" y2="335" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="215" x2="720" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
